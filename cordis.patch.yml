# dsh-utils — bundle layer for the utility components.
#
# The root package of this workspace is both the bundle and the main component:
# it owns the patch + locale + icon + browser bundle (client.js), and
# `utils-main` mounts that same package as an ordinary row. Because that row is
# a package-root row, DSH's client-module scanner also serves this package's
# client.js from it. The remaining components are separate packages under
# `packages/`, mounted by name — the same shape as the official experimental
# bundles, whose component packages are independent.
#
#   utils-main           — the root package itself: recursive SKILL.md discovery
#                          in nested skill folders, plus the legacy global
#                          skill-repository JSON routes (their UI moved into
#                          dsh-workbench) and the browser half (client.js).
#   dsh-approval-policy  — unattended approval gate: subagent/scheduled/cron
#                          approval requests wait a bounded window, then settle
#                          with a fail-closed default instead of hanging forever.
#   dsh-notify           — session notifications: a turn ending, a pending
#                          approval, or a pending question is pushed through a
#                          Gotify gateway, tagged with this device's name.
#   dsh-skill-panel      — settings-page skill switchboard: lists the skills the
#                          current session can read and hides disabled ones from
#                          the model catalog while keeping them manually
#                          invocable.
#   dsh-workbench        — preset workbench: registers each
#                          ~/.dsh/.agent-presets/<id>/ directory as a real
#                          agent preset through cordis:include, then serves
#                          routes that list/toggle its skills, edit its
#                          Markdown, and sync a Git repository into it.
#
# Row ids double as settings namespaces and stay stable.

- insert:
    - id: utils-main
      name: '@xi4z/dsh-utils'
      config: {}
    - id: dsh-approval-policy
      name: '@xi4z/dsh-utils-approval-policy'
      config: {}
    - id: dsh-notify
      name: '@xi4z/dsh-utils-notify'
      config:
        # 留空 = 内置默认。下面只列出最常改的几项，完整字段见 README。
        #
        # 出口：Gotify 网关。url/token 建议用环境变量注入，避免把凭据写进仓库：
        #   DSH_QQ_NOTIFY_GOTIFY_URL / DSH_QQ_NOTIFY_GOTIFY_TOKEN
        transport: gotify
        # 密钥可以不落盘：'${VAR}' 在投递前从环境变量展开（也支持 targets[].tokenEnv），
        # 或整段用 DSH_QQ_NOTIFY_GOTIFY_URL / DSH_QQ_NOTIFY_GOTIFY_TOKEN 覆盖。
        # 先只记日志：确认能收到再改成 false（或在 profile patch 里覆盖）。
        dryRun: true
        # 设备名留空 = 自动取主机名；deviceLabel 是渲染到 {device} 的显示名。
        deviceName: ''
        deviceLabel: ''
        notifyOnReasons:
          - completed
          - error
          - aborted
        notifyOnApproval: true
        notifyOnQuestion: true
    - id: dsh-skill-panel
      name: '@xi4z/dsh-utils-skill-panel'
      config:
        # 模型技能目录里隐藏的技能名；面板开关写入这里，热生效。
        disabledSkills: []
    - id: dsh-workbench
      name: '@xi4z/dsh-utils-workbench'
      config:
        # 单文件读写上限（字节）。AGENTS.md 本质上也是提示词，别放太大。
        maxBytes: 524288
        # 额外的预设根目录；每个子目录是一个预设。
        presetDirs: []
        # 额外的共享预设来源（技能仓库）；读取其 .dsh 下的预设，供面板同步。
        presetSourceDirs: []
        # 保留为原生的预设 id；其余原生声明可导入成目录预设并发布到共享仓库。
        builtinPresets:
          - standard
          - ptc
          - minimal
          - creator
        # 全局 / 项目 AGENTS.md 视图的额外文件与递归扫描。
        extraAgentsFiles: []
        scanNestedAgents: false
        nestedDepth: 3
        # 新预设技能仓库的默认值。
        defaultRepoUrl: 'https://github.com/xi4z/skills'
        defaultBranch: 'Agent'
